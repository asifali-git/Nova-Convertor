name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Push pe dono runs ek saath na chaleyn - latest hi chahiye
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ci-logs branch pe build log push karne ke liye (neeche ka debug channel)
    permissions:
      contents: write
    env:
      # Aliyun/Tencent mirrors GitHub runners se slow + stall-prone hain.
      # settings.gradle.kts is env ko padh kar unhe skip karta hai.
      NOVA_USE_MIRRORS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows pe commit hua gradlew executable bit gawa deta hai
      # (git core.filemode=false) - Linux runner pe uske bina chalta hi nahi.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK ko runner ke pre-installed copy pe bharosa nahi - GitHub ke
      # image versions me pre-installed SDK/ANDROID_HOME ka behavior badalta
      # rehta hai, aur 2026 ke images me bhi setup-android v3 fail ho rahi thi.
      # Is liye Google se cmdline-tools khud download kar rahe hain taaki
      # environment deterministic ho (local.properties gitignored hai, so
      # ANDROID_HOME/ANDROID_SDK_ROOT GITHUB_ENV me set ho rahe hain).
      # Diagnosis hamesha file me jaata hai, taaki fail hone par bina admin
      # rights ke artifacts se padh sakein.
      - name: Install Android SDK
        run: |
          set -uo pipefail
          DIAG="$RUNNER_TEMP/sdk-diag.txt"
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          exec > >(tee -a "$DIAG") 2>&1

          echo "== environment =="
          echo "ANDROID_HOME='${ANDROID_HOME:-<unset>}'  ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-<unset>}'"
          echo "sdkmanager on PATH: $(command -v sdkmanager || echo '<not found>')"
          ls -d /usr/local/lib/android/sdk 2>&1 || echo "no /usr/local/lib/android/sdk"
          echo "== downloading cmdline-tools =="
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SM"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "== accepting licenses =="
          yes | "$SM" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          echo "== installing platforms + build-tools =="
          "$SM" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "== installed =="
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      # ---- Release signing (MANDATORY) ---------------------------------------------
      # Pehle yahan "graceful fallback" tha: secrets na hone par build.gradle.kts
      # debug-key pe chala deta tha, output ka naam app-release.apk hi rehta tha,
      # aur step green ho jaati. Nateeja: 54 MB ka APK jo na phone pe install
      # hota (installed app ke signature se mismatch -> "package conflict") aur
      # na Play pe upload hota. Woh trap hata di.
      # Ab: 4 signing secrets hona ZAROORI hai. Nahi to yahin fail - aur message
      # batata hai exactly kaunsa secret missing hai.
      - name: Require release signing secrets
        id: guard
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]  && missing="$missing KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]      && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]   && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            # Kaunsa secret missing hai - sirf NAAAM, value kabhi nahi.
            # Ye file neeche ci-logs branch me jaati hai, taaki andaza na lagana pade.
            mkdir -p ci-logs
            {
              echo "guard_date=$(date -u +%FT%TZ)"
              echo "missing_secrets:$missing"
              echo "note: secret naam case-insensitive hain, par woh"
              echo "note: REPOSITORY secrets hone chahiye (Environment secrets nahi)."
              echo "note: Variables bhi nahi - sirf 'Secrets' tab."
              echo "present=$( [ -n "$KEYSTORE_BASE64" ] && echo 1 || echo 0 )$([ -n "$STORE_PASSWORD" ] && echo 1 || echo 0)$([ -n "$KEY_ALIAS" ] && echo 1 || echo 0)$([ -n "$KEY_PASSWORD" ] && echo 1 || echo 0)  (KEYSTORE_BASE64,STORE_PASSWORD,KEY_ALIAS,KEY_PASSWORD = 1=hai 0=nahi)"
            } > ci-logs/_guard.txt
            echo "::error::Release signing ke liye ye repository secrets missing hain:$missing"
            echo "::error::Repo Settings > Secrets and variables > Actions > New repository secret"
            echo "::error::  KEYSTORE_BASE64 = release.keystore ka base64 (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('release.keystore')))"
            echo "::error::  STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD = keystore.properties ki values"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "saare 4 signing secrets maujood - release properly signed hoga"

      - name: Materialize release keystore
        if: steps.guard.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # release.keystore gitignored hai - phir bhi pakad ke hataye dete hain
          git check-ignore -q release.keystore && echo "release.keystore correctly gitignored"
          ls -la release.keystore keystore.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'app/libs/*.aar') }}
          restore-keys: gradle-${{ runner.os }}-

      # --rerun-tasks jaan-boojh kar nahi: CI pe har run fresh container hai.
      # Purani debug pipeline me ek baar iske bina Gradle ne BUILD SUCCESSFUL
      # dikha diya tha jabki compile hua hi nahi tha (incremental ne up-to-date
      # samajh liya). Is liye agar kabhi "kuch change nahi hua par build alag
      # behave kar raha hai" jaisa confusing case dikhe, yahan wapas laga dena.
      # Har build ka poora output ek file me bhi jaata hai (tee), aur bash ke
      # default -eo pipefail ki wajah se pipeline ka exit code Gradle ka hi
      # rehta hai. Fail hone par woh file neeche ci-logs branch me jaati hai.
      - name: Build debug APK
        run: |
          set -eo pipefail
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee debug-build.log

      # Release variant ke dono rup:
      #   assembleRelease -> APK (sideload / Galaxy Store / direct distrib.)
      #   bundleRelease   -> AAB (Play Store naye apps ke liye SIRF yehi leta hai)
      # Play Console sirf AAB accept karta hai, isliye AAB zaruwi hai - APK
      # kaafi nahi jo (ye main pehle miss kar gaya tha).
      - name: Build release APK
        run: |
          set -eo pipefail
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee release-apk-build.log

      - name: Build release AAB (Play Store)
        run: |
          set -eo pipefail
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee release-aab-build.log

      # Build fail hua to Gradle ki poori log artifact me chala jaaye.
      # Workflow-run logs download karne ke liye admin rights chahiye, par
      # artifacts bina admin ke bhi khulte hain - debug isliye asaan rehta hai.
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sdk-diag.txt
            app/build/reports/**
            app/build/outputs/apk/**/*.txt
            **/build/generated/**
          retention-days: 7
          if-no-files-found: warn

      - name: Dump APK + AAB contents
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          # ---- APKs ----
          for v in debug release; do
            APK="app/build/outputs/apk/$v/app-$([ "$v" = debug ] && echo debug || echo release).apk"
            if [ -f "$APK" ]; then
              {
                echo "=== $v APK ($(stat -c%s "$APK") bytes) ==="
                unzip -l "$APK" > "ci-logs/apk-$v.txt" 2>&1 || true
                echo "--- entries per ABI (lib/) ---"
                awk '$4 ~ /^lib\// { split($4,a,"/"); sz[a[2]]+=$1; n[a[2]]++ } END { for (k in sz) printf "%s  %.1f MB  %d files\n", k, sz[k]/1048576, n[k] }' "ci-logs/apk-$v.txt" | sort
                echo "--- biggest 15 entries ---"
                sort -k1 -nr "ci-logs/apk-$v.txt" | head -16
              } > "ci-logs/apk-$v-summary.txt"
              cat "ci-logs/apk-$v-summary.txt"
            fi
          done
          # ---- AAB (Play Store isi ko leta hai) ----
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            {
              echo "=== release AAB ($(stat -c%s "$AAB") bytes) ==="
              unzip -l "$AAB" > "ci-logs/aab-release.txt" 2>&1 || true
              echo "--- per-ABI byte totals ---"
              awk '$4 ~ /\/lib\// { split($4,a,"/"); sz[a[length(a)-1]]+=$1; n[a[length(a)-1]]++ } END { for (k in sz) printf "%s  %.1f MB  %d files\n", k, sz[k]/1048576, n[k] }' "ci-logs/aab-release.txt" | sort
              echo "--- biggest 15 entries ---"
              sort -k1 -nr "ci-logs/aab-release.txt" | head -16
              echo "--- do ABIs hain? ---"
              grep -oE 'native/(arm64-v8a|x86_64)' "ci-logs/aab-release.txt" | sort -u || true
            } > "ci-logs/aab-release-summary.txt"
            cat "ci-logs/aab-release-summary.txt"
          else
            echo "AAB nahi mila - bundleRelease fail hua?" | tee "ci-logs/aab-release-summary.txt"
          fi

      # Signing ka proof sirf workflow log me rehna theek nahi: log download
      # karne ke liye admin chahiye aur Azure-redirect wala endpoint 401 deta
      # hai (isi liye yahan bhi nahi padha ja saka). Isliye apksigner + keystore
      # ka cert DONO ci-logs/signing.txt me likha jaata hai, aur publish step
      # use ci-logs branch me push kar deti hai - git se padh liya jaayega.
      # Dono ka SHA-256 digest match hona chahiye: yahi prove karta hai ki APK
      # aapke release.keystore se signed hai, debug key se nahi.
      - name: Verify release signing
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -uo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "=== apksigner verify --print-certs (release APK) ==="
            "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
            echo ""
            echo "=== keystore se expected cert (keytool) ==="
            if [ -f release.keystore ]; then
              keytool -list -v -keystore release.keystore \
                -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 \
                | grep -E "Alias name|SHA256:|Owner:|Valid from" || true
            else
              echo "release.keystore step me materialize nahi hui"
            fi
            echo ""
            echo "=== match check ==="
            # dhyan: pehle wala regex colons maang raha tha, jabki apksigner
            # digest bina colon deta hai -> grep exit 1 -> GitHub Actions ka
            # default `bash -e` ne script wahin maar di thi (is liye run #10
            # red tha, warna proof upar se match ho chuka tha).
            # Dono taraf se hex nikaalo, colon hata ke compare karo.
            # aur ek aur trap: apksigner lowercase deta hai, keytool uppercase -
            # dono digest identical hote hue bhi string compare fail ho jaata
            # tha (run #11). tr 'a-f' 'A-F' se dono taraf same case me laao.
            APKD=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK" 2>/dev/null \
                   | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F' || true)
            KSD=$(keytool -list -v -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
                   | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' :' | tr 'a-f' 'A-F' || true)
            if [ -n "$APKD" ] && [ "$APKD" = "$KSD" ]; then
              echo "SIGNED_OK digest_match=$APKD"
            else
              echo "MISMATCH apk=[$APKD] keystore=[$KSD]"
              exit 1
            fi
          } 2>&1 | tee ci-logs/signing.txt
          # AAB ka bhi signer cert nikaal do (Play isi ko check karega)
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            {
              echo "=== AAB signer cert ==="
              keytool -printcert -jarfile "$AAB" 2>&1 | grep -E "Owner:|SHA256:|Alias name" || true
            } | tee -a ci-logs/signing.txt
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # Signing upar wale guard se guarantee hai, isliye artifact ke naam me
      # DEBUGKEY jaisa marker ki zaroorat nahi - jo banta hai woh release.keystore
      # se properly signed hota hai.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

      # Play Console sirf AAB accept karta hai (naye apps ke liye APK reject).
      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

      # ---- Debug channel (SABSE LAST me, taaki saara data mila ho) -----------
      # Workflow-run logs download karne ke liye admin rights chahiye, aur
      # artifact zip ka API rate-limited/401 deta hai. Isliye build log, SDK
      # diagnostics aur APK ki poori listing ek `ci-logs` branch me push hoti
      # hai - normal git se padh liya jaata hai, koi auth nahi. always() isliye
      # kyunki APK ka size verify karna failure case ke liye hi nahi hai.
      - name: Publish CI report to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          cp -f debug-build.log     ci-logs/ 2>/dev/null || true
          cp -f release-apk-build.log ci-logs/ 2>/dev/null || true
          cp -f release-aab-build.log ci-logs/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/sdk-diag.txt" ci-logs/ 2>/dev/null || true
          cp -f ci-logs/apk-*.txt   ci-logs/ 2>/dev/null || true
          if [ -f app/build/reports/problems/problems-report.html ]; then
            cp -f app/build/reports/problems/problems-report.html ci-logs/ 2>/dev/null || true
          fi
          {
            echo "run_id=$GITHUB_RUN_ID  sha=$GITHUB_SHA  attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$(uname -a)"
            echo "java=$(java -version 2>&1 | tr '\n' ' ')"
            echo "gradle_version=$(./gradlew --version 2>/dev/null | grep -i '^Gradle' || true)"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NOVA_USE_MIRRORS=${NOVA_USE_MIRRORS:-<unset>}"
            echo "free_mem=$(free -m | head -2 | tr '\n' ' ')"
            ls -la ci-logs/ || true
          } > ci-logs/_summary.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B se branch current commit se banti hai, phir index khaali karke
          # sirf ci-logs/ add karte hain. `git clean` bilkul nahi - woh abhi
          # bani ci-logs/ directory ko hi uda deta tha (push khaali chala jaata).
          git checkout -B ci-logs
          git rm -rq --cached . > /dev/null 2>&1 || true
          git add -f ci-logs
          git commit -q -m "ci logs: run $GITHUB_RUN_ID sha ${GITHUB_SHA:0:7}" || echo "nothing to commit"
          git push -f origin ci-logs && echo "ci-logs branch pushed" || echo "ci-logs push FAILED"